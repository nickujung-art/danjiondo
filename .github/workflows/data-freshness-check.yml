name: 데이터 신선도 점검

# 배치가 "돌았는지"가 아니라 **데이터가 실제로 갱신됐는지**를 매일 확인한다.
#
# 2026-08-03 전수검사에서 침묵 실패 5건이 한꺼번에 드러났다. 전부 잡은 성공으로 끝났는데
# 데이터는 안 들어온 경우였고(네이버 크롤러 2개는 두 달, 월간 AI 해설은 52일),
# 잡 단위 감시로는 하나도 못 잡았다. 테이블의 최신 타임스탬프를 보면 전부 즉시 드러났다.
#
# 실패하면 GitHub 이 저장소 소유자에게 메일을 보낸다 — 그게 이 워크플로의 알림 경로다.

on:
  schedule:
    # 매일 08:00 KST (UTC 23:00). 주요 배치(molit-daily 04:00, rankings 매시)가
    # 끝난 뒤에 재야 전날 결과를 판정할 수 있다.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      warn_only:
        description: '위반이 있어도 성공으로 끝내기 (true/false)'
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  check:
    name: 신선도 점검
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 파이프를 쓰지 않으므로 종료 코드가 그대로 전달된다.
      # (다른 워크플로에서 `| tee` 가 exit 코드를 삼켜 배치 전량 실패가 초록불이던 전례가 있다)
      - name: 데이터 신선도 점검
        run: >-
          npx tsx scripts/check-data-freshness.ts
          ${{ github.event.inputs.warn_only == 'true' && '--warn-only' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
