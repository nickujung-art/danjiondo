name: 가격 예측 배치 (고전 모델 — 은퇴, 수동 전용)

# [은퇴 2026-10-01] 이 배치의 산출물은 **읽기 시점에 전량 폐기되고 있었다.**
#
# 같은 테이블(`complex_price_predictions`)의 같은 키(complex_id, area_bucket,
# predicted_month)에 두 배치가 쓴다 — 이쪽(linear·double-exp·holt-winters, 17:00Z)과
# `compute-predictions-ai.yml`(chronos-bolt-small, 18:00Z).
# 그런데 소비처 `src/lib/data/invest.ts` 의 `MODEL_PRIORITY` 가
# `chronos > holt-winters > double-exp > linear` 로 **단지별 최상위 모델만 남기고
# 나머지 행을 버린다**(near/far 모델 혼재 차단). 읽기 범위는 `computed_at >= 2일 전`.
#
# 그 2일 창 안에서 실측했다(2026-10-01):
#   창 안 단지 3,318개 — 고전만 0 / Chronos만 1,735 / 둘다 1,583
#   => 고전 모델이 **유일한 예측원인 단지: 0개** (7일 창으로 넓혀도 0개)
# Chronos 는 이쪽이 계산하는 단지를 전부 덮고 중재에서 항상 이긴다. 즉 이 배치는
# 매일 30분을 써서 **아무도 읽지 않는 행**을 만들고 있었다.
#
# 겸해서 이 배치는 2026-09-27~09-30 나흘 연속 30분 타임아웃으로 중단됐다.
# ADR Phase 41 이 그 위험을 이미 실측으로 적어 두고("24m15s 로 timeout-minutes: 30 에
# 근접", 부산 거래 811,996건 유입 후 초과 위험) 후속 과제로 남긴 것이 그대로 실현된 것이다.
# **타임아웃을 올리는 것은 틀린 수정이다** — 버려지는 계산에 시간을 더 쓰는 것뿐이다.
#
# 그래서 스케줄만 끄고 코드·시크릿·수동 실행 경로는 남긴다(ADR-059 와 같은 방식).
# Chronos 가 죽었을 때 폴백으로 쓰려면 `workflow_dispatch` 로 돌릴 수 있다 —
# 다만 그것은 **지금도 폴백이 아니었다**(2일 창 기여 0). 진짜 폴백이 필요하면 별도 설계다.
#
# 되살릴 때 반드시 함께 볼 것:
#   1. `timeout-minutes` — 30 은 부족하다는 것이 실측으로 확인됐다
#   2. `scripts/check-data-freshness.ts` 의 `가격예측 (고전 모델)` 점검 줄을 되살린다
#      (지금은 Chronos 전용으로만 감시한다)
on:
  # schedule:
  #   - cron: '0 17 * * *'   # 02:00 KST — 2026-10-01 은퇴. 위 주석 참조
  workflow_dispatch: {}

jobs:
  compute:
    name: 전체 단지 가격 예측 계산
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 가격 예측 계산 (전체 단지 × 4 area_bucket)
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/compute-predictions.ts
