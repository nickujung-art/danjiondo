name: Naver Area Types Monthly Sync

# [정기 실행 중단 — 2026-08-07, ADR-059]
# naver-listings-biweekly.yml 과 같은 이유다(네이버의 GitHub Actions IP 차단).
# 이쪽은 월 1회라 아직 빨간불이 한 번도 안 떴는데, 마지막 성공(2026-08-01)은 pipefail
# 수정(2026-08-03) 이전이라 **실패가 삼켜진 초록불**이었다. 09-01 부터는 정직하게 빨간불이 된다.
#
# 영향 확인(2026-08-07): 운영권역 활성 1,895곳 중 평형정보 보유 965곳(51%). 평형정보가
# 없으면 화면은 공식 평형명 대신 "전용 N㎡" 로 폴백한다(설계된 동작). 수집이 멈춘
# 2026-06-19 이후 운영권역 신규 단지는 1곳뿐이라 **보류 중에 더 나빠지지는 않는다.**
#
# 차단 해제 확인은 workflow_dispatch 수동 실행으로 한다.
on:
  # schedule:
  #   - cron: '0 1 1 * *'  # 매월 1일 10:00 KST (UTC 01:00)
  workflow_dispatch:
    inputs:
      limit:
        description: '처리할 단지 수 (기본: 전체)'
        default: ''

jobs:
  sync:
    name: 네이버 평형 데이터 동기화
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install chromium --with-deps

      - name: Sync naver area types
        # 파이프(| tee)가 스크립트 종료 코드를 삼키지 않도록 pipefail 을 켠다.
        # GitHub 기본 셸은 `bash -e {0}` 라 pipefail 이 없어, 스크립트가 exit 1 로 죽어도
        # tee 의 0 이 최종 종료 코드가 됐다(2026-08-03 발견 — 배치 전량 실패에도 초록불).
        shell: bash
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24"
          npx tsx scripts/crawl-naver-area-types.ts
          ${{ github.event.inputs.limit && format('--limit={0}', github.event.inputs.limit) || '' }}
          2>&1 | tee area-types-run.log
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_COOKIE:              ${{ secrets.NAVER_COOKIE }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-types-run-log-${{ github.run_id }}
          path: area-types-run.log
          retention-days: 14
