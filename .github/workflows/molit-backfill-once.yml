name: MOLIT Backfill (1회성)

# [D-05] 한 job(job timeout 5시간)에 들어가는 양은 대략 1,560 지역-월(11.5초 중간값
# 기준) = 5~6개 구다. 부산 16개 구 × 201501~ 전체(4,480 지역-월)는 약 14.3시간 추정 — 한 job 의
# 3배라 3그룹(5·5·6) 분할 dispatch 가 필수다. 그룹 경계는 --sgg_codes 로, 기간은 아래 from/to
# 입력으로, 이어달리기는 resume 입력으로 조절한다(41-02, .planning/phases/41-busan-recollect/41-CONTEXT.md).

on:
  workflow_dispatch:
    inputs:
      sgg_codes:
        description: 'SGG 코드 (쉼표 구분, 예: 48121,48123,48125). regions 테이블에서 확인.'
        required: true
        default: '48121,48123'
      resume:
        description: >-
          완료된 (지역,월) 을 skip 한다. 기본값 true — 미입력 시 현재 동작(--resume 고정)과 동일하다.
          부산 최초 재수집처럼 ingest_runs 를 비운 직후에는 켜둬도 무해하다.
        type: boolean
        default: true
      from:
        description: >-
          시작 연월(YYYYMM). 미입력 시 스크립트 기본값(현재로부터 10년 전)을 그대로 쓴다 —
          기존 동작과 동일. 부산 재수집은 201501(창원·김해와 대칭, D-04).
        required: false
        default: ''
      to:
        description: >-
          종료 연월(YYYYMM). 미입력 시 스크립트 기본값(당월)을 그대로 쓴다 — 기존 동작과 동일.
        required: false
        default: ''
      min_linked_pct:
        description: >-
          연결률 검사 임계(%). 미입력 시 check-ingest-linkage.ts 기본값 80 이 그대로 적용된다 —
          기존 동작(창원·김해 임계 80)과 동일. 부산은 65(경남 기타 실측 64.7%, D-07).
        required: false
        default: ''

jobs:
  backfill:
    name: MOLIT 실거래가 백필
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MOLIT backfill
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 입력을 셸 변수로 먼저 받고 인용해서 쓴다 — run: 본문에 ${{ inputs.* }} 를
          # 직접 보간하지 않는다(명령 주입 방지, T-41-05).
          SGG="${{ inputs.sgg_codes }}"
          RESUME="${{ inputs.resume }}"
          FROM="${{ inputs.from }}"
          TO="${{ inputs.to }}"

          ARGS=(--sgg="$SGG")

          # resume 이 'true' 일 때만 --resume 를 붙인다. 미입력 시 기본값이 'true' 이므로
          # 입력을 전부 비운 dispatch 는 현재 동작(--resume 하드코딩)과 같아진다.
          if [ "$RESUME" = "true" ]; then
            ARGS+=(--resume)
          fi

          # from/to 가 비어 있지 않을 때만 플래그를 붙인다. 🔴 빈 값을 --from= 형태로
          # 그대로 넘기면 backfill-realprice.ts 의 인자 검증(41-02)이 exit 1 로 잡아
          # dispatch 가 전부 실패한다 — molit-daily.yml prepare job 의 [ -z "$FROM" ] 패턴을 따른다.
          if [ -n "$FROM" ]; then
            ARGS+=(--from="$FROM")
          fi
          if [ -n "$TO" ]; then
            ARGS+=(--to="$TO")
          fi

          echo "실행: npx tsx scripts/backfill-realprice.ts ${ARGS[*]}"
          npx tsx scripts/backfill-realprice.ts "${ARGS[@]}"

      # 백필이 조용히 미연결 더미를 만드는 것을 막는다.
      #
      # 2026-05-26 백필에서 창원·김해만 15,315건이 complex_id=null 로 적재됐다.
      # 그날 적재 18,934건 중 연결은 3,619건(19.1%)뿐이었는데 **아무도 몰랐다** —
      # 4개월 뒤 마린애시앙(4,298세대) 페이지에 "4개월째 거래 없음"이 뜨고 나서야
      # 발견됐다. 원인(매칭 RPC 실패가 "매칭 없음"과 구분되지 않고 캐시에 굳음)은
      # src/lib/data/complex-id-lookup.ts 에서 고쳤지만, 그 위에 "아무도 결과를 보지
      # 않는" 문제가 겹쳐 있었다. 이 단계가 그쪽을 막는다.
      #
      # 연결률이 임계 미만이면 exit 1 로 잡을 빨간불로 만든다 — 조용한 성공이
      # 이 프로젝트가 반복해 겪은 실패 원인이다.
      - name: Check linkage rate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SGG="${{ inputs.sgg_codes }}"
          MIN_LINKED_PCT="${{ inputs.min_linked_pct }}"

          ARGS=(--since-hours=8 --sgg="$SGG")

          # 비어 있지 않을 때만 --min-linked-pct= 를 붙인다. 미입력 시 스크립트 기본값
          # 80 이 그대로 적용돼 기존 용도(창원·김해)의 감시 기준선이 바뀌지 않는다.
          if [ -n "$MIN_LINKED_PCT" ]; then
            ARGS+=(--min-linked-pct="$MIN_LINKED_PCT")
          fi

          echo "실행: npx tsx scripts/check-ingest-linkage.ts ${ARGS[*]}"
          npx tsx scripts/check-ingest-linkage.ts "${ARGS[@]}"

      - name: Backfill complete
        run: echo "백필 완료 — ingest_runs 테이블에서 결과 확인"
