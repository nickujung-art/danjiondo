name: 학교알리미 통계 수집 (연 1회)

# [2026-07-31] 스케줄을 붙였다. 그전까지 workflow_dispatch 전용이라 **아무도 돌리지 않았고**,
# facility_school 최종 적재가 2026-07-06 에 멈춰 있었다(그 실행도 CI가 아니라 로컬이었을 것이다 —
# SCHOOL_API_KEY 가 GitHub Secrets 에 등록돼 있지 않아 CI에서는 실패했을 상태였다).
#
# 주기를 분기가 아니라 **연 1회**로 잡은 이유: 학교알리미 공시 자체가 연 1회(보통 4~5월)다.
# 더 자주 돌려도 같은 값을 다시 받아올 뿐이고, data_sources 의 신선도 기대치만 어긋난다.

on:
  schedule:
    # 매년 5월 2일 05:00 KST (UTC 5월 1일 20:00) — 공시(4~5월) 직후를 노린다
    - cron: '0 20 1 5 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '--dry-run: DB 수정 없이 결과만 확인'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# 실행 시점: 매년 학교알리미 공시 갱신 후 (보통 4~5월)
# 진학률(scrape-school-advancement.ts)은 11월 공시 후 별도 수동 실행

jobs:
  collect:
    name: 학교 통계 수집 (학급당학생수·교원비율)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 학교알리미 API 통계 수집
        env:
          NEXT_PUBLIC_SUPABASE_URL:   ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCHOOL_API_KEY:             ${{ secrets.SCHOOL_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/collect-school-stats.ts --dry-run
          else
            npx tsx scripts/collect-school-stats.ts
          fi
