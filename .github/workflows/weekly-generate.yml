name: Weekly Card News Generation

on:
  schedule:
    # 매주 월요일 00:10 KST (일요일 15:10 UTC)
    - cron: '10 15 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (HTML only, no PNG)'
        type: boolean
        default: false
      series:
        description: 'Specific series IDs (comma-separated, leave empty for all)'
        type: string
        default: ''
      post_instagram:
        description: 'Post to Instagram after generation (수동 실행 시만 체크 — cron은 자동 포스팅 안 함)'
        type: boolean
        default: false
      instagram_series:
        description: 'Instagram series to post (comma-separated, leave empty for city-overall only)'
        type: string
        default: 'city-overall'

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-news

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: card-news/package-lock.json

      - name: Install Chromium system dependencies
        run: sudo apt-get install -y libgbm-dev libxss1 libasound2t64 libatk-bridge2.0-0 libgtk-3-0

      - name: Install dependencies
        run: npm ci

      - name: Cache Pretendard fonts
        uses: actions/cache@v4
        with:
          path: card-news/fonts
          key: pretendard-1.3.9

      - name: Download Pretendard fonts
        run: node scripts/setup.js

      - name: Generate card news
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.series }}" ]; then ARGS="$ARGS --series=${{ inputs.series }}"; fi
          # --persist: 슬라이드 데이터를 contents 에 적재한다 (창부레터 0-4 / ADR-004 §2).
          #            없으면 웹 뷰어와 아카이브가 빈 화면이 된다.
          #
          # 🔴 --persist-series 를 넓히지 말 것 (Phase 40-04 B-4 사용자 결정).
          #    PNG 는 18시리즈 전부 만들지만 아카이브에 발행물로 올리는 것은 city-overall 뿐이다.
          #    실측상 실제 발행 시리즈 수는 회차마다 1/18/1 로 불균일했다 — 생성됐다는 이유로
          #    전부 적재하면 발행된 적 없는 카드뉴스가 아카이브에 published 로 올라간다.
          #    수동 실행에서 series 를 지정하면 그것이 곧 발행 의도이므로 적재 범위도 따라간다.
          PERSIST_SERIES="${{ inputs.series }}"
          if [ -z "$PERSIST_SERIES" ]; then PERSIST_SERIES="city-overall"; fi
          echo "적재 범위: $PERSIST_SERIES"
          node scripts/generate.js --persist --persist-series="$PERSIST_SERIES" $ARGS

      - name: Upload PNG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: card-news-${{ github.run_id }}
          path: card-news/output/
          retention-days: 30

      # ⚠️  Instagram 자동 포스팅은 cron에서 실행되지 않음.
      #     workflow_dispatch에서 post_instagram 체크박스를 켜야만 실행됨.
      - name: Post to Instagram
        if: ${{ inputs.post_instagram == true }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          WEEK=$(ls -1 output/ | sort | tail -1)
          SERIES="${{ inputs.instagram_series }}"
          if [ -z "$SERIES" ]; then SERIES="city-overall"; fi
          echo "게시 주차: $WEEK / 시리즈: $SERIES"
          node scripts/post-instagram.js --week=$WEEK --series=$SERIES
