name: Weekly Regional Commentary

# 지역별 주간 실거래 AI 코멘트 생성 → regional_commentary 테이블 upsert.
# realtrade-story 홈 피드가 이 결과를 읽어 "이번 주 OO 실거래 요약"으로 노출한다
# (그쪽 저장소는 외부 AI API를 직접 호출하지 않는 아키텍처라 생성은 여기서 한다).
#
# 구조는 monthly-ai-commentary.yml 을 그대로 따랐고 주기만 주간으로 바꿨다.

on:
  schedule:
    # 매주 월요일 06:00 KST (UTC 일요일 21:00).
    # molit-daily(매일 04:00 KST)가 주말 신고분까지 적재한 뒤에 돌도록 여유를 둔다.
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      week_start:
        description: '집계 시작일 YYYY-MM-DD (비우면 직전 완결 주)'
        default: ''
      dry_run:
        description: 'DB 쓰지 않고 출력만 (true/false)'
        default: 'false'

jobs:
  generate-regional-commentary:
    name: 지역별 주간 AI 코멘트 생성
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Regional Commentary
        run: >-
          npx tsx scripts/generate-regional-commentary.ts
          ${{ github.event.inputs.week_start && format('--week-start={0}', github.event.inputs.week_start) || '' }}
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          2>&1 | tee regional-commentary-run.log
        env:
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-commentary-log-${{ github.run_id }}
          path: regional-commentary-run.log
          retention-days: 14
