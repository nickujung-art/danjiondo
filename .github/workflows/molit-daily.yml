name: MOLIT 일배치 (전월+당월 실거래가)

# 수집 본체는 molit-ingest-attempt.yml 에 있고, 여기서는 **러너를 바꿔가며 최대 3회** 호출한다.
# 러너 IP 가 data.go.kr 에 차단될 확률이 회당 약 1/3(2026-08-04 러너 6대 측정: 2대 차단)이라
# 3회면 전부 실패할 확률이 약 4%까지 떨어진다. 자세한 배경은 attempt 워크플로 주석 참고.

on:
  schedule:
    - cron: '0 19 * * *'   # 04:00 KST — 매일 자동 실행
  workflow_dispatch:
    inputs:
      from_ym:
        description: '시작 연월 (예: 202604). 미입력 시 전월 자동 계산'
        required: false
        default: ''
      to_ym:
        description: '종료 연월 (예: 202605). 미입력 시 당월 자동 계산'
        required: false
        default: ''

jobs:
  prepare:
    name: 수집 기간 계산
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.months.outputs.from }}
      to:   ${{ steps.months.outputs.to }}
    steps:
      - name: 수집 기간 계산
        id: months
        shell: bash
        run: |
          FROM="${{ inputs.from_ym }}"
          TO="${{ inputs.to_ym }}"
          if [ -z "$FROM" ]; then
            FROM=$(node -e "const d=new Date(new Date().getFullYear(),new Date().getMonth()-1,1);process.stdout.write(d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0'))")
          fi
          if [ -z "$TO" ]; then
            TO=$(node -e "const d=new Date();process.stdout.write(d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0'))")
          fi
          echo "from=$FROM" >> $GITHUB_OUTPUT
          echo "to=$TO"     >> $GITHUB_OUTPUT
          echo "수집 기간: $FROM ~ $TO"

  attempt1:
    needs: prepare
    uses: ./.github/workflows/molit-ingest-attempt.yml
    secrets: inherit
    with:
      from_ym: ${{ needs.prepare.outputs.from }}
      to_ym:   ${{ needs.prepare.outputs.to }}
      attempt: '1/3'

  attempt2:
    needs: [prepare, attempt1]
    if: needs.attempt1.outputs.blocked == 'true'
    uses: ./.github/workflows/molit-ingest-attempt.yml
    secrets: inherit
    with:
      from_ym: ${{ needs.prepare.outputs.from }}
      to_ym:   ${{ needs.prepare.outputs.to }}
      attempt: '2/3'

  attempt3:
    needs: [prepare, attempt2]
    if: needs.attempt2.outputs.blocked == 'true'
    uses: ./.github/workflows/molit-ingest-attempt.yml
    secrets: inherit
    with:
      from_ym: ${{ needs.prepare.outputs.from }}
      to_ym:   ${{ needs.prepare.outputs.to }}
      attempt: '3/3'

  verdict:
    name: 결과 판정
    needs: [attempt1, attempt2, attempt3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 3회 모두 차단이면 **빨간불로 남긴다**. 조용히 넘어가면 08-02 처럼 0건 적재하고도
      # 초록불이라 아무도 모르는 상황이 다시 생긴다.
      - name: 3회 모두 차단이면 실패 처리
        if: needs.attempt3.outputs.blocked == 'true'
        run: |
          echo "::error::3개 러너 모두 data.go.kr 에 차단돼 수집하지 못했습니다. 차단 범위가 넓어졌을 수 있습니다."
          exit 1
      # 적재는 됐는데 단지 연결이 깨진 상태를 잡는다. 위 "차단" 판정과 다른 축이다 —
      # 수집은 성공했는데 complex_id 가 안 붙으면 거래가 어느 단지 화면에도 나타나지
      # 않는다. 2026-05-26 백필이 정확히 그 상태였고 4개월간 아무도 몰랐다.
      # 임계 미만이면 exit 1(스크립트가 처리) — 조용한 성공을 만들지 않는다.
      # verdict 잡은 원래 checkout 이 없다(에코만 했다) — 스크립트를 돌리려면 필요하다.
      - uses: actions/checkout@v5
        if: needs.attempt3.outputs.blocked != 'true'
      - uses: actions/setup-node@v5
        if: needs.attempt3.outputs.blocked != 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: 연결률 검사
        if: needs.attempt3.outputs.blocked != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci --silent
          npx tsx scripts/check-ingest-linkage.ts --since-hours=6

      - name: 요약
        if: always()
        run: |
          echo "attempt1 blocked=${{ needs.attempt1.outputs.blocked }}"
          echo "attempt2 blocked=${{ needs.attempt2.outputs.blocked }}"
          echo "attempt3 blocked=${{ needs.attempt3.outputs.blocked }}"
          echo "ingest_runs 테이블에서 결과 확인 가능"
