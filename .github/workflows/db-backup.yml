name: DB Backup

# 🔴 2026-08-21 사고 — 이 백업이 **공개 인터넷에 노출돼 있었다.**
#
# 이 잡은 원본 `pg_dump` 를 쓴다(`supabase db dump` 와 달리 `auth`·`storage` 를 포함한다 —
# 전체 복원에 필요하므로 그건 옳다). 그런데 결과물을 **`github.repository`(= 공개 저장소
# `nickujung-art/danjiondo`)의 Release 자산**으로 올리고 있었다. 인증 없이 HTTP 200 이었다.
#
# 노출된 것(2026-08-19 덤프 기준): auth.users 7행(email·encrypted_password) ·
# auth.refresh_tokens 58행 · auth.custom_oauth_providers.client_secret(네이버 OAuth 시크릿) ·
# auth.identities · auth.sessions · public.push_subscriptions 5행(endpoint+p256dh+auth →
# 임의 푸시 발송 가능) · profiles · favorites · notifications · user_child_profiles.
# 다운로드 횟수는 전부 0 이었다 — 제3자가 받아간 흔적은 없다.
#
# **교훈: 백업의 안전이 "저장소 공개 설정"에 달려 있으면 안 된다.** 그 설정은 사람이 언제든
# 바꿀 수 있고, 바뀌어도 이 잡은 계속 초록불이다(6주간 스키마만 백업하면서도 초록불이었던
# 아래 2026-08-10 사례와 같은 모양이다 — **실패가 신호를 내지 않는 구조**).
# 그래서 목적지를 비공개 저장소로 옮기고, **올리기 직전에 목적지가 정말 비공개인지 확인하는
# 게이트**를 넣었다.

on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:

permissions:
  contents: read   # 더 이상 이 저장소에 쓰지 않는다 — 결과물은 비공개 저장소로 간다

env:
  # 백업 보관 저장소. **반드시 비공개여야 한다**(아래 Verify 단계가 강제한다).
  #
  # 이 저장소와 `BACKUP_PAT` 시크릿은 **2026-05-07~08 에 이미 만들어져 있었다** —
  # 저장소 생성 다음 날 PAT 이 등록됐다. 즉 비공개 보관은 원래 의도된 구조였는데
  # 워크플로가 그걸 안 쓰고 `github.repository`(공개)로 올리고 있었다.
  # `GITHUB_TOKEN` 은 자기 저장소에만 쓸 수 있어 교차 저장소 업로드에는 PAT 이 필요하다.
  BACKUP_REPO: nickujung-art/danjiondo-backup

jobs:
  backup:
    name: pg_dump -> private repo release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install postgresql-client-17
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      # 🔴 덤프를 뜨기 **전에** 목적지를 확인한다. 뜬 뒤에 확인하면, 게이트가 막아도
      # 러너 디스크에 개인정보 덤프가 남은 채로 잡이 끝난다. 만들지 않는 게 낫다.
      - name: Verify destination repo is private
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
        run: |
          set -e
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: BACKUP_PAT 시크릿이 없습니다. 비공개 저장소에 올릴 수 없습니다." >&2
            exit 1
          fi
          VIS=$(gh repo view "$BACKUP_REPO" --json visibility --jq .visibility)
          echo "destination: $BACKUP_REPO ($VIS)"
          if [ "$VIS" != "PRIVATE" ]; then
            echo "ERROR: 백업 목적지가 PRIVATE 이 아닙니다($VIS). 덤프를 만들지 않고 중단합니다." >&2
            echo "이 덤프에는 auth.users·refresh_tokens·OAuth client_secret 이 들어 있습니다." >&2
            exit 1
          fi

      - name: Run pg_dump
        env:
          BACKUP_AGENT_PASSWORD: ${{ secrets.BACKUP_AGENT_PASSWORD }}
        run: |
          set -e
          FILENAME="backup-$(date +%Y-%m-%d).sql.gz"
          export PGCONNECT_TIMEOUT=60
          export PGPASSWORD="$BACKUP_AGENT_PASSWORD"
          # ── 2026-08-10 정정 3건 ──────────────────────────────────────────────
          # 이 잡은 6주 넘게 초록불이면서 **스키마만** 백업하고 있었다(덤프 38~43KB 고정).
          # 실제 파일을 열어보니 CREATE TABLE 99개는 다 있는데 COPY 는 1개뿐이고
          # auth.audit_log_entries 한가운데서 끝나 있었다 — 첫 데이터 테이블에서 죽은 것이다.
          #
          # (1) `2>&1 | gzip` 이 **stderr 를 백업 파일 안으로** 밀어넣고 있었다.
          #     그래서 Actions 로그가 깨끗했고 6주 동안 아무도 몰랐다. stderr 는 로그로 보낸다.
          # (2) `set -e` 는 파이프라인 중간 명령의 실패를 못 잡는다(최종 종료코드는 gzip 의 0).
          #     pipefail 을 켜고 PIPESTATUS 로 pg_dump 자체의 종료코드를 본다.
          # (3) 크기 하한 10KB 는 무의미했다 — 스키마만 담긴 43KB 가 그대로 통과했다.
          #     실데이터가 들어오면 수십 MB 이므로 10MB 로 올린다.
          # 파이프·프로세스치환을 쓰지 않는다 — 중간 명령의 실패를 놓치기 쉽다.
          # 평범한 파일로 받고, 종료코드를 확인한 뒤에 압축한다.
          set +e
          /usr/lib/postgresql/17/bin/pg_dump \
            --host=aws-0-ap-northeast-2.pooler.supabase.com \
            --port=5432 \
            --username=backup_agent.jaamyvlsehlimtrxgrgn \
            --dbname=postgres \
            --no-password \
            --no-owner \
            --no-privileges \
            > /tmp/dump.sql 2> /tmp/pg_dump.err
          PG_RC=$?
          set -e

          echo "── pg_dump stderr ──"
          cat /tmp/pg_dump.err || true
          echo "────────────────────"
          echo "raw dump: $(wc -c < /tmp/dump.sql) bytes / exit=$PG_RC"
          if [ "$PG_RC" -ne 0 ]; then
            echo "ERROR: pg_dump 가 exit $PG_RC 로 실패했습니다(위 stderr 확인)" >&2; exit 1
          fi

          gzip -c /tmp/dump.sql > "/tmp/$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          DUMP_SIZE=$(wc -c < "/tmp/$FILENAME")
          echo "pg_dump complete: $DUMP_SIZE bytes"

          # 크기 가드: 스키마만 담긴 덤프가 통과하지 못하는 값이어야 한다.
          if [ "$DUMP_SIZE" -lt 10000000 ]; then
            echo "ERROR: 덤프가 ${DUMP_SIZE} bytes 로 너무 작습니다 — 데이터가 안 담긴 것으로 보입니다(하한 10MB)" >&2
            exit 1
          fi

          # 크기만으로는 부족하다. **데이터 블록이 실제로 있는지** 확인한다.
          COPY_COUNT=$(gzip -dc "/tmp/$FILENAME" | grep -c '^COPY ' || true)
          echo "COPY 블록: ${COPY_COUNT}개"
          if [ "$COPY_COUNT" -lt 20 ]; then
            echo "ERROR: COPY 블록이 ${COPY_COUNT}개뿐입니다 — 스키마만 덤프된 상태입니다" >&2
            exit 1
          fi

      - name: Upload to private backup repo
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
        run: |
          set -e
          if ! gh release view db-backups --repo "$BACKUP_REPO" > /dev/null 2>&1; then
            gh release create db-backups \
              --repo "$BACKUP_REPO" \
              --title "DB Backups" \
              --notes "주간 자동 DB 백업. **개인정보·자격증명 포함**(auth.users·refresh_tokens·OAuth client_secret) — 이 저장소를 절대 공개로 바꾸지 말 것." \
              --prerelease
          fi
          gh release upload db-backups "/tmp/$FILENAME" \
            --repo "$BACKUP_REPO" \
            --clobber
          echo "Uploaded $FILENAME to $BACKUP_REPO"

      - name: Cleanup backups older than 90 days
        env:
          GH_TOKEN: ${{ secrets.BACKUP_PAT }}
        run: |
          CUTOFF=$(date -d '90 days ago' +%Y-%m-%d)
          gh release view db-backups --repo "$BACKUP_REPO" --json assets \
            --jq ".assets[] | select(.name | test(\"backup-\")) | select(.name | ltrimstr(\"backup-\") | rtrimstr(\".sql.gz\") < \"$CUTOFF\") | .name" \
          | while read -r OLD_FILE; do
            gh release delete-asset db-backups "$OLD_FILE" \
              --repo "$BACKUP_REPO" --yes || true
            echo "Deleted old backup: $OLD_FILE"
          done
