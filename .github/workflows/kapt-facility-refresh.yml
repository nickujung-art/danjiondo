name: KAPT 시설정보 월간 커버리지

# [2026-09-23] 신설.
#
# 왜 만들었나 — Vercel 일배치의 kapt 단계가 **구조적으로 절반만 돈다.**
#   대상 70건 × 호출 ~1.7초 = 119초  vs  KAPT_TIME_BUDGET_MS 60초
# 2026-09-23 실행에서 "대상 70 · 적재 35 · 미조회 34"로 드러났다.
# 지금은 SLA(45일) 초과가 0건이지만, 하루 35건이면 2,926단지를 한 바퀴 도는 데
# **84일**이 걸려 약 7주 뒤 SLA가 깨진다. 45일을 지키려면 하루 65건이 필요하다.
#
# Vercel 함수 시간을 늘려 해결할 문제가 아니다. `scripts/kapt-facility-enrich.ts`가
# 이미 전수 처리기이고 속도제한 대기(RATE_LIMIT_DELAY_MS)까지 갖췄다 —
# 1회성으로만 묶여 있던 것을 주기 실행으로 푼다. (ADR-001: 보조 티어는 GitHub Actions)
#
# `--missing-only`는 **이번 달 data_month 레코드에 값이 있는 단지를 건너뛴다.**
# 따라서 달이 바뀌면 전수를 훑고, 같은 달 안의 재실행은 거의 무비용이다.
#
# 매일 도는 이유 — GitHub 스케줄 발화율이 실측 41%다(ax-sub FINDINGS §33).
# 월 1회로 걸면 그 달을 통째로 건너뛸 수 있다. 매일 걸면 기회가 ~30번이라
# 사실상 확실해지고, 이미 끝난 날은 조회 몇 번으로 끝난다.
on:
  schedule:
    # 20:00 UTC = 05:00 KST. Vercel 일배치(19:00 UTC)가 끝난 뒤에 돈다.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '전수 재적재 (--missing-only 없이). 이번 달 것도 다시 받는다'
        type: boolean
        default: false

concurrency:
  # 앞 실행이 아직 돌고 있으면 겹치지 않게 한다. 전수 훑기는 수십 분이 걸린다.
  group: kapt-facility-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: KAPT 시설정보 보충 (이번 달 미수집분)
    runs-on: ubuntu-latest
    # 월초 전수 훑기가 2,900여 단지 × 2회 호출이라 넉넉히 잡는다.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: KAPT 시설정보 적재
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            npx tsx scripts/kapt-facility-enrich.ts
          else
            npx tsx scripts/kapt-facility-enrich.ts --missing-only
          fi
        env:
          KAPT_API_KEY: ${{ secrets.KAPT_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
