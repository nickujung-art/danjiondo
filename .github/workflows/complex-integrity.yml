name: Complex Integrity Check

# 단지-거래 무결성 감시.
#
# [왜 있나]
# 2026-08-06 전수 점검에서 찾은 오염(거래가 엉뚱한 단지에 붙음, 정식 단지가 빈 페이지,
# 76세대 레코드가 791건 보유 등)은 전부 **조용히** 쌓였다. 잡기 어려워서가 아니라
# 아무도 보지 않았기 때문이다. 그 점검을 매일 자동으로 돌린다.
#
# [세 검출 축 — 서로 다른 것을 잡는다]
#   1) 다중 지번    지번이 갈리고 **동까지 다르면** 다른 건물이 섞였다. 같은 동 인접
#                  필지(창원더샵센트럴파크 = 가음동 15·16·17)는 정상이라 동으로 거른다.
#                  이 필터가 없으면 거짓 양성이 절반이다.
#   2) 회전율 이상  거래수÷세대수÷10년 > 25%. **지번이 단일이어도 잡혀** 1번이 놓치는
#                  것을 잡는다(76세대가 791건을 갖고 있던 STX칸이 이 축으로 발견됐다).
#   3) 정식 단지 공백  kapt_code 가 있는데 거래 0건이면 그 거래는 다른 레코드에 있다.
#                  1·2번의 **대상 단지를 찾는 데** 쓴다.
#
# [왜 psql 직결인가 — PostgREST 가 아니라]
# 계산이 8~11초 걸린다(운영권역 거래 30만 행 집계). PostgREST 세션 상한은 8초라
# 처음 만든 TS 스크립트는 원격에서 그대로 타임아웃으로 죽었다(run 31074627194).
# sgg_code 인덱스를 추가해도 나아지지 않았다 — 병목이 스캔이 아니라 집계다.
# psql 직결에는 statement_timeout 이 없다(refresh-price-stats.yml 과 같은 경로).
#
# [무엇이 실패를 만드나]
# 절대 수치가 아니라 **기준선 대비 증가**만 실패시킨다. 아직 미해결이 남아 있는데
# (대상 단지가 아예 없어 붙일 곳이 없는 것들) 절대값으로 판정하면 매일 빨간불이라
# 아무도 안 보게 된다. 오염을 줄였으면 아래 기준선도 함께 내려 잠근다.

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST — 일배치(04:00)·파생값 집계(05:00) 이후
  workflow_dispatch: {}

env:
  # 기준선 (2026-08-06 측정). 넘으면 실패한다.
  #
  # 2026-08-20 부산 16개 구 수집 재개(Phase 41 / ADR-064) 후 재dispatch 실측:
  # multi_jibun 9→10 · turnover_anomaly 23(불변) · empty_kapt 59(불변).
  # 🔴 이 셋 중 움직인 건 multi_jibun 하나뿐이고, **그 원인은 부산이 아니다.**
  # 이 함수는 ARRAY['48121','48123','48125','48127','48129','48250'](운영권역 6곳)만
  # 인자로 받는다(41-01 Task 3 이 PostgREST OpenAPI 스펙의 실제 파라미터명 p_sgg 로
  # 대조 확인) — 부산(26xxx)은 이 인자에 절대 들어가지 않으므로 이 지표에 영향을 줄 수
  # 없다. turnover_anomaly·empty_kapt 가 그대로인 것이 그 스코프 격리를 다시 실증한다.
  # ── multi_jibun 이력 ──────────────────────────────────────────────────────
  # 2026-08-20  9 → 10   창원·김해 2015~2016 결손 백필(+38,833건)로 기존 오연결이
  #                      임계(소수 동 50건)를 새로 넘었다. 41-09 가 기준선을 10 으로
  #                      올렸으나 **되돌렸다** — 원인 미조사 오염을 기준선에 흡수하면
  #                      영구히 "정상" 이 되고 다시는 경보가 뜨지 않는다(ADR-063 부류).
  # 2026-08-21 10 →  7   전수 조사 후 실제로 고쳤다. 아래 참조.
  #
  # 🔽 **7 로 내려 잠근다.** 래칫은 개선 방향으로만 돈다 — 아래 DO 블록 자신이
  #    "기준선보다 낮아졌다 → BASE_* 를 내려 잠글 것" 이라고 안내한다.
  #    지금 내려두지 않으면 다음에 오염이 8건 생겨도 경보가 뜨지 않는다.
  #
  # 무엇을 고쳤나 (2026-08-21):
  #   - 거래↔단지 매칭이 **이름만으로** 붙이던 것을 지번 게이트로 막았다
  #     (20260821090000 + 20260821100000). match_complex_by_admin 은 지번이
  #     **유일하게** 한 단지를 가리킬 때만 그 단지로 확정하고, 1차·2차가 같은 지번을
  #     쓰는 충돌 그룹(14건)에서는 게이트를 끄고 이름에 맡긴다
  #   - 이름 단독 매칭으로 생긴 오연결 1,659건을 정리했다(이동 329 + 끊기 1,330).
  #     카카오 63회 교차검증 — 시영장미 ← 7,544m 떨어진 양덕동 거래 67건 등
  #   - 근거: .planning/data-quality/matching-ambiguous-20260805.md (realtrade-story)
  #     *"이름이 같고 동이 다르면 지번을 먼저 본다"*
  #
  # ── 2026-08-25 조사: 9곳이 되었으나 **올리지 않는다** ──────────────────────
  # complex_integrity_detail() 을 새로 만들어(20260825110000) 9곳을 전부 특정하고
  # 각 단지의 등록 주소와 실제 거래 지번을 대조했다. **9곳 중 8곳이 진짜 오염이다:**
  #   내동주공1단지[성산]  등록 내동 454-9   → 신월동 90:221 vs 내동 454:205  ← 다수가 남의 동
  #   목연오피스텔[김해]   등록 삼방동 186-5 → 어방동 531:72 + 530:51
  #   배진[마산회원]      등록 양덕동 151-7 → 구암동 1323:31 / 합성동 129:22
  #   광남백조[김해]      등록 구산동 257   → 봉황동 447·454·459 = 86 / 동상동 835:18
  #   구산주공3단지[김해]  등록 구산동 429   → 외동 705:84
  #   합성무학[마산회원]   등록 합성동 694-1 → 양덕동 829:38
  #   한우아파트11.12동   등록 자산동 327-8 → 창포동3가 1:62
  #   반림럭키[성산]      등록 반림동 8     → 가음동 14:50 (319건 정리한 잔여분)
  # 정당한 것은 **대동다숲아파트 1곳뿐**이다 — 내서읍 원계리/삼계리인데 20260821090000 이
  # "카카오 실측 0m, 같은 부지" 로 이미 기록했다.
  #
  # 🔴 그래서 7 을 유지한다. 9 로 올리면 **실제 오염 8건을 정상으로 박제한다** —
  #    이 워크플로가 경고하는 바로 그 상황이다(ADR-063 부류). 데이터를 고쳐 내린다.
  #
  # ── 2026-08-26 정정: 전건 오연결 정리로는 안 내려간다 ──────────────────────
  # 5,999건(이동 1,754 + 끊기 4,245)을 정리했는데 이 축은 **9 그대로**다.
  # 두 population 이 겹치지 않는다 — 9곳 중 단 하나도 전건 오연결 감사 대상이 아니었다:
  #   확정 지번 없음 4곳(내동주공1단지·대동다숲·배진·목연오피스텔) — 다수결 0.6 미달이라
  #     complex_canonical_jibun 에 아예 없다. 감사가 대조할 대상이 없다
  #   확정 지번 = 자기 동 5곳(반림럭키 96% · 한우아파트 90% · 합성무학 87% ·
  #     광남백조 83% · 구산주공3단지 86%) — 감사는 "등록 동 ≠ 확정 동" 을 찾는데 일치한다
  #
  # 즉 **전건 오연결(다수가 남의 것)과 이 축(소수가 남의 것)은 다른 결함이다.**
  # 이 축은 audit-complex-address-match.ts + verify-tx-jibun-kakao.ts(원래 모드) 의 영역이다.
  #
  # 🔽 2026-08-26: 그 경로로 실제로 처리해 **9 → 4** 가 됐다. 7 → 4 로 내려 잠근다.
  #    audit-complex-address-match 가 8곳(contaminated 5 + merge_suspect 3)을 뽑고,
  #    카카오 13회로 소수 (동,지번) 묶음을 실측해 확정된 338건만 끊었다:
  #      구산주공3단지 외동 705(84) 2,819m · 한우아파트 창포동3가(62) 2,220m
  #      반림럭키 가음동 14-5(50) 3,918m · 광남백조 봉황동·동상동(83) 1,160~1,267m
  #      배진 구암동·합성동(53) 2,321~3,426m · 한빛빌라 어방동 345-2(6) 1,581m
  #    각 단지는 자기 거래를 유지했다(반림럭키 1,286건 유지, 50건만 끊기).
  #
  #    남은 4곳의 성격은 파악돼 있다:
  #      대동다숲아파트  **정당하다.** 내서읍 원계리/삼계리가 카카오 실측 0m(두 번 확인)
  #      내동주공1단지   dong_mismatch — 신월동 221 vs 내동 205, **다수가 남의 것**
  #      목연오피스텔    dong_mismatch — 어방동 123 vs 삼방동 94, 같은 유형
  #      합성무학       양덕동 38건이 감사 임계(소수 동 50)에 못 미쳐 안 뽑혔다
  #    dong_mismatch 2곳은 다수를 지오코딩해야 하는데 --in 모드는 소수만 본다.
  #    별도 처리가 필요하다(운영권역 dong_mismatch 는 총 108곳으로 별개 캠페인이다).
  #
  # 🔽 2026-08-26(2차): 4 → 3. dong_mismatch 1,682건을 끊으면서 내동주공1단지가 해소됐다
  #    (신월동 221 vs 내동 205 였는데 신월동 쪽이 카카오 검증으로 남의 것이 확인됐다).
  #    남은 3곳: 대동다숲아파트(정당, 0m) · 합성무학 · 목연오피스텔.
  BASE_MULTI_JIBUN: 3

  # ── turnover_anomaly 23 → 33 (2026-08-21) ────────────────────────────────
  # 🔍 **조사한 뒤 올린다.** 원인 미상으로 올리지 않는다는 원칙은 그대로다.
  #
  # 확인한 것:
  #   1) 증가는 **결손 백필의 기계적 결과**다. 창원·김해 2015~2016 을 채우며 거래가
  #      +38,833건 늘었는데 분모(household_count)는 고정이라 더 많은 단지가 임계를
  #      넘는다. 이 지표는 이력이 길어질수록 자연히 커지는 구조다
  #   2) 상위권은 **회전율이 높은 게 아니라 `household_count` 가 과소 기재**돼 있다:
  #        신리마을중앙하이츠8단지   96세대 / 979건  → 연 88%
  #        석봉마을대동아파트        90세대 / 916건  → 연 88%
  #        현대2차아파트            120세대 / 1,044건 → 연 75%
  #      90세대에 916건은 회전율 문제가 아니다. 세대수가 틀린 것이다
  #      (석봉마을대동은 등록 동도 틀렸다 — 부곡동인데 거래는 무계동 915건)
  #
  # 즉 이 축이 지금 재는 것은 오염이 아니라 **`complexes` 메타데이터 품질**이다.
  #
  # ⚠️ **"household_count 백필로 고치면 된다"는 판단은 틀렸다** (2026-08-21 실측으로 정정).
  #    세대수 0/null 인 480곳 중 **K-apt 코드 보유는 20곳뿐**이다(세대수 있는 1,408곳은
  #    613곳이 보유). 나머지 460곳은 소형 빌라·연립이라 K-apt 에 등록 자체가 없다.
  #    건축물대장도 대안이 못 된다 — 실측하니 `hhldCnt`·`hoCnt`·`fmlyCnt` 가 **전부 0**으로
  #    온다(회원맨션 마산회원 회원동 29-4). 필드가 없는 게 아니라 국토부 원본에 값이 없다.
  #
  #    → **채울 데이터 소스가 존재하지 않는다.** 이 지표는 소형 건물에 대해 구조적으로
  #      의미가 없으며, 개선하려면 지표 정의를 바꿔야 한다(예: household_count > 0 인
  #      단지만 대상으로 삼기). 그건 이 워크플로가 참조하는 complex_integrity_counts
  #      함수를 고치는 일인데, 그 함수는 **저장소에 CREATE FUNCTION 이 없다**(프로덕션에만
  #      존재하는 마이그레이션 drift). 먼저 파일화가 필요하다.
  #
  # 🔽 **2026-08-25: 33 → 32 로 내려 잠근다.** 래칫은 개선 방향으로만 돈다 —
  #    지금 내려두지 않으면 다음에 오염이 33 이 되어도 경보가 안 뜬다.
  #    (원인 조사가 필요한 것은 '오를 때' 뿐이다. 내려갈 때는 잠그면 된다.)
  #
  # 🔽 2026-08-26: 32 → 28. 전건 오연결 5,999건 정리(이동 1,754 + 끊기 4,245)로 분자가
  #    줄어 개선됐다. 래칫은 개선 방향으로만 돈다.
  #
  # 🔽 2026-08-26(2차): 28 → 27. 위 정리로 분자가 더 줄었다.
  BASE_TURNOVER: 27
  # ── empty_kapt 59 → 61 (2026-08-21) ──────────────────────────────────────
  # 🔍 함수 정의를 확보하고 나서야 판정할 수 있었다(20260821140000 이 파일화했다).
  #
  #     empty_kapt = kapt_code IS NOT NULL AND household_count > 0 AND 거래 0건
  #
  # **`household_count > 0` 조건이 핵심이다.** enrich-apt-unmatched.ts 가 건축물대장으로
  # 세대수를 0에서 양수로 채우면 그 단지가 **집계 모수에 새로 들어온다.** 즉 59 → 61 은
  # 오염이 늘어난 게 아니라 **재는 대상이 넓어진 것**이다.
  #
  # 이 지표는 앞으로도 enrich 를 돌릴 때마다 조금씩 오른다. 그게 정상이다 —
  # "K-apt 에 등록됐는데 거래가 한 건도 없다" 는 상태 자체는 그대로이고, 우리가 그것을
  # 볼 수 있게 된 단지가 늘어난 것뿐이다.
  #
  # ⚠️ 그러므로 이 축의 상승은 **오염 신호로 읽지 않는다.** 진짜 신호는
  #    "세대수를 채우지 않았는데 올랐다" 는 경우다. 그때만 조사한다.
  #
  # 2026-08-25: 61 → 62. **오염이 아니다.** 위 규칙("모수가 넓어져 오른다")에 해당한다.
  # complex_integrity_detail() 로 62곳의 준공연도를 확인했다:
  #   2009년 이전 57곳 · 2010~19년 3곳 · 2024년 1곳 · 연도없음 1곳
  # 2024년 준공(성산 삼정그린코아 포레스트, 401세대)은 아직 거래가 없는 것이 정상이고,
  # 나머지는 "K-apt 에 등록됐는데 거래가 한 건도 없다" 는 상태가 그대로인 옛 단지들이다.
  #
  # 2026-08-26: 62 → 66. **오염이 아니라 위 정리의 직접 결과다.** 전건 오연결을 끊으면서
  # K-apt 등록 단지 4곳이 거래 0건이 됐다 — 자기 거래가 없고 남의 거래만 붙어 있던 곳들이다.
  # 끊기 전에는 "거래 있음" 으로 세어져 이 축에 안 걸렸다. 상태가 정직해진 것이다.
  #
  # 2026-08-26(2차): 66 → 67. 앞과 같은 이유다 — dong_mismatch 끊기로 K-apt 등록 단지가
  # 하나 더 거래 0건이 됐다. 오염이 아니라 상태가 정직해진 것이다.
  BASE_EMPTY_KAPT: 67

  # ── orphan_merged (2026-08-25 신설) ──────────────────────────────────────
  # 다른 세 축과 성격이 다르다 — 오염의 **양**이 아니라 **스키마 불변식 위반**을 센다.
  # 그래서 complex_integrity_counts 함수에 넣지 않고 여기서 직접 센다
  # (그 함수는 반환 타입 변경이라 CREATE OR REPLACE 로 못 바꾸고 DROP 이 필요하다).
  #
  #     status='merged' AND successor_id IS NULL
  #
  # 병합 관례(20260806080000)는 세 가지를 함께 하도록 정한다: 참조를 옮기고 ·
  # source 를 merged 로 남기고 · **successor_id 를 넣는다.** 세 번째가 빠지면
  # 매칭 RPC 의 COALESCE(successor_id, id) 가 자기 id 를 돌려주고, 단지는 앱에서
  # 안 보이는데(앱은 status='active' 로 거른다) 거래는 계속 붙는 흡인기가 된다.
  # 2026-08-24 에 그렇게 갇힌 거래가 51건 있었다.
  #
  # 20260825100000 이 그런 단지를 매칭 후보에서 빼서 **흡인은 막았다.** 이 축은
  # 그 뒤에 남는 질문을 감시한다 — "병합 도구가 또 successor 를 빼먹는가".
  #
  # 기준선 19 는 현존량이다. 이 19곳은 successor 를 줄 수 없어서 남는다:
  # --propose-successors 실측 결과 **명확 0 / 애매 11 / 후보없음 8** 이고,
  # "애매" 11곳은 전부 차수가 달라(부영e-그린6차→5차 등) successor 로 주면
  # 그 자체가 1차/2차 뭉갬이 된다. 그래서 0 이 목표가 아니다 —
  # **늘어나지 않는 것**이 목표다.
  BASE_ORPHAN_MERGED: 19

jobs:
  check:
    name: 단지-거래 무결성
    runs-on: ubuntu-latest
    steps:
      - name: Install psql 17
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          echo | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Check integrity
        env:
          BACKUP_AGENT_PASSWORD: ${{ secrets.BACKUP_AGENT_PASSWORD }}
        run: |
          set -e
          export PGCONNECT_TIMEOUT=60
          export PGPASSWORD="$BACKUP_AGENT_PASSWORD"
          # ON_ERROR_STOP=1 이 없으면 RAISE EXCEPTION 이 나도 psql 이 0 을 반환해
          # 이 잡이 초록불이 된다 — 이번 점검이 잡아낸 부류의 실수가 정확히 그것이다.
          /usr/lib/postgresql/17/bin/psql \
            --host=aws-0-ap-northeast-2.pooler.supabase.com \
            --port=5432 \
            --username=backup_agent.jaamyvlsehlimtrxgrgn \
            --dbname=postgres \
            --no-password \
            -v ON_ERROR_STOP=1 \
            -v base_mj="$BASE_MULTI_JIBUN" \
            -v base_to="$BASE_TURNOVER" \
            -v base_ek="$BASE_EMPTY_KAPT" \
            -v base_om="$BASE_ORPHAN_MERGED" \
            <<'SQL'
          \set QUIET on
          \timing off
          -- psql 변수는 $$ ... $$ 안에서 치환되지 않는다. GUC 로 넘긴 뒤 DO 블록에서
          -- current_setting() 으로 읽는다. (여기 SET 줄은 달러인용 밖이라 치환된다.)
          SET myapp.base_mj = :base_mj;
          SET myapp.base_to = :base_to;
          SET myapp.base_ek = :base_ek;
          SET myapp.base_om = :base_om;
          DO $$
          DECLARE
            r         record;
            base_mj   int := current_setting('myapp.base_mj')::int;
            base_to   int := current_setting('myapp.base_to')::int;
            base_ek   int := current_setting('myapp.base_ek')::int;
            base_om   int := current_setting('myapp.base_om')::int;
            v_om      int;
            worse     text[] := '{}';
            d         record;
            better    text[] := '{}';
            db_bytes  bigint;
            db_pct    numeric;
          BEGIN
            SELECT * INTO r FROM public.complex_integrity_counts(
              ARRAY['48121','48123','48125','48127','48129','48250']);

            RAISE INFO '다중 지번(동 다름, 소수 50건↑)  %  (기준 %)', r.multi_jibun, base_mj;
            RAISE INFO '회전율 이상(>25%%, 거래 100건↑)  %  (기준 %)', r.turnover_anomaly, base_to;
            RAISE INFO 'K-apt 등록인데 거래 0건          %  (기준 %)', r.empty_kapt, base_ek;

            -- 스키마 불변식: merged 인데 successor 가 없으면 COALESCE 가 무력해진다.
            SELECT count(*) INTO v_om
            FROM public.complexes
            WHERE status = 'merged' AND successor_id IS NULL;
            RAISE INFO 'merged 인데 successor 없음        %  (기준 %)', v_om, base_om;

            -- DB 용량 상시 로깅 (실패 조건 아님, RAISE INFO 뿐).
            -- 2026-08-10 삭제(ADR-062)의 원인이 용량이었다 — 이 관측이 없으면 다음 지역
            -- 확장 판단이 다시 사람이 Dashboard 를 들여다보는 것에 의존하게 된다.
            SELECT pg_database_size(current_database()) INTO db_bytes;
            db_pct := round(db_bytes::numeric / (8192.0 * 1024 * 1024) * 100, 2);
            RAISE INFO 'DB 용량  %  / 8,192MB Pro 한도 (% 사용)', pg_size_pretty(db_bytes), (db_pct::text || '%');

            IF r.multi_jibun      > base_mj THEN worse := worse || format('multi_jibun %s→%s', base_mj, r.multi_jibun); END IF;
            IF r.turnover_anomaly > base_to THEN worse := worse || format('turnover %s→%s', base_to, r.turnover_anomaly); END IF;
            IF r.empty_kapt       > base_ek THEN worse := worse || format('empty_kapt %s→%s', base_ek, r.empty_kapt); END IF;
            IF v_om               > base_om THEN worse := worse || format('orphan_merged %s→%s', base_om, v_om); END IF;

            IF r.multi_jibun      < base_mj THEN better := better || format('multi_jibun %s→%s', base_mj, r.multi_jibun); END IF;
            IF r.turnover_anomaly < base_to THEN better := better || format('turnover %s→%s', base_to, r.turnover_anomaly); END IF;
            IF r.empty_kapt       < base_ek THEN better := better || format('empty_kapt %s→%s', base_ek, r.empty_kapt); END IF;
            IF v_om               < base_om THEN better := better || format('orphan_merged %s→%s', base_om, v_om); END IF;

            IF array_length(better,1) > 0 THEN
              RAISE INFO '기준선보다 낮아졌다: % — 워크플로의 BASE_* 를 내려 잠글 것',
                array_to_string(better, ', ');
            END IF;

            IF array_length(worse,1) > 0 THEN
              -- 🔴 **어느 단지인지 함께 찍는다.** 이 워크플로의 규약은 "개별 단지를 특정해
              --    사유를 적은 뒤에만 기준선을 올린다" 인데, 그 특정을 할 도구가 없었다.
              --    숫자만 보고는 운영권역 거래 34만 행을 애플리케이션에서 집계해야 했고
              --    (PostgREST 1,000행씩 340번) 실제로 2분 제한에 걸려 실패했다.
              --    complex_integrity_detail() 은 같은 판정 기준으로 행을 돌려준다(1초).
              RAISE INFO '── 넘어선 축의 해당 단지 ──';
              FOR d IN
                SELECT * FROM public.complex_integrity_detail(
                  ARRAY['48121','48123','48125','48127','48129','48250'])
                WHERE (axis = 'multi_jibun'      AND r.multi_jibun      > base_mj)
                   OR (axis = 'turnover_anomaly' AND r.turnover_anomaly > base_to)
                   OR (axis = 'empty_kapt'       AND r.empty_kapt       > base_ek)
                ORDER BY axis, canonical_name
              LOOP
                RAISE INFO '  [%] %[%]  %', d.axis, d.canonical_name, d.sgg_code, d.detail;
              END LOOP;

              RAISE EXCEPTION E'오염이 늘었다: %\n조사 방법은 realtrade-story 의 .planning/data-quality/audit-20260806.md '
                '"검출 축 세 가지" 참고. 원인은 대개 셋 중 하나다 — 새 중복 레코드 생성 / '
                '병합이 시딩으로 되돌아감 / 매칭이 엉뚱한 단지를 잡음.',
                array_to_string(worse, ', ');
            END IF;

            RAISE INFO '기준선 이내';
          END $$;
          SQL
