name: Complex Integrity Check

# 단지-거래 무결성 감시.
#
# [왜 있나]
# 2026-08-06 전수 점검에서 찾은 오염(거래가 엉뚱한 단지에 붙음, 정식 단지가 빈 페이지,
# 76세대 레코드가 791건 보유 등)은 전부 **조용히** 쌓였다. 잡기 어려워서가 아니라
# 아무도 보지 않았기 때문이다. 그 점검을 매일 자동으로 돌린다.
#
# [세 검출 축 — 서로 다른 것을 잡는다]
#   1) 다중 지번    지번이 갈리고 **동까지 다르면** 다른 건물이 섞였다. 같은 동 인접
#                  필지(창원더샵센트럴파크 = 가음동 15·16·17)는 정상이라 동으로 거른다.
#                  이 필터가 없으면 거짓 양성이 절반이다.
#   2) 회전율 이상  거래수÷세대수÷10년 > 25%. **지번이 단일이어도 잡혀** 1번이 놓치는
#                  것을 잡는다(76세대가 791건을 갖고 있던 STX칸이 이 축으로 발견됐다).
#   3) 정식 단지 공백  kapt_code 가 있는데 거래 0건이면 그 거래는 다른 레코드에 있다.
#                  1·2번의 **대상 단지를 찾는 데** 쓴다.
#
# [왜 psql 직결인가 — PostgREST 가 아니라]
# 계산이 8~11초 걸린다(운영권역 거래 30만 행 집계). PostgREST 세션 상한은 8초라
# 처음 만든 TS 스크립트는 원격에서 그대로 타임아웃으로 죽었다(run 31074627194).
# sgg_code 인덱스를 추가해도 나아지지 않았다 — 병목이 스캔이 아니라 집계다.
# psql 직결에는 statement_timeout 이 없다(refresh-price-stats.yml 과 같은 경로).
#
# [무엇이 실패를 만드나]
# 절대 수치가 아니라 **기준선 대비 증가**만 실패시킨다. 아직 미해결이 남아 있는데
# (대상 단지가 아예 없어 붙일 곳이 없는 것들) 절대값으로 판정하면 매일 빨간불이라
# 아무도 안 보게 된다. 오염을 줄였으면 아래 기준선도 함께 내려 잠근다.

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST — 일배치(04:00)·파생값 집계(05:00) 이후
  workflow_dispatch: {}

env:
  # 기준선 (2026-08-06 측정). 넘으면 실패한다.
  #
  # 2026-08-20 부산 16개 구 수집 재개(Phase 41 / ADR-064) 후 재dispatch 실측:
  # multi_jibun 9→10 · turnover_anomaly 23(불변) · empty_kapt 59(불변).
  # 🔴 이 셋 중 움직인 건 multi_jibun 하나뿐이고, **그 원인은 부산이 아니다.**
  # 이 함수는 ARRAY['48121','48123','48125','48127','48129','48250'](운영권역 6곳)만
  # 인자로 받는다(41-01 Task 3 이 PostgREST OpenAPI 스펙의 실제 파라미터명 p_sgg 로
  # 대조 확인) — 부산(26xxx)은 이 인자에 절대 들어가지 않으므로 이 지표에 영향을 줄 수
  # 없다. turnover_anomaly·empty_kapt 가 그대로인 것이 그 스코프 격리를 다시 실증한다.
  # ── multi_jibun 이력 ──────────────────────────────────────────────────────
  # 2026-08-20  9 → 10   창원·김해 2015~2016 결손 백필(+38,833건)로 기존 오연결이
  #                      임계(소수 동 50건)를 새로 넘었다. 41-09 가 기준선을 10 으로
  #                      올렸으나 **되돌렸다** — 원인 미조사 오염을 기준선에 흡수하면
  #                      영구히 "정상" 이 되고 다시는 경보가 뜨지 않는다(ADR-063 부류).
  # 2026-08-21 10 →  7   전수 조사 후 실제로 고쳤다. 아래 참조.
  #
  # 🔽 **7 로 내려 잠근다.** 래칫은 개선 방향으로만 돈다 — 아래 DO 블록 자신이
  #    "기준선보다 낮아졌다 → BASE_* 를 내려 잠글 것" 이라고 안내한다.
  #    지금 내려두지 않으면 다음에 오염이 8건 생겨도 경보가 뜨지 않는다.
  #
  # 무엇을 고쳤나 (2026-08-21):
  #   - 거래↔단지 매칭이 **이름만으로** 붙이던 것을 지번 게이트로 막았다
  #     (20260821090000 + 20260821100000). match_complex_by_admin 은 지번이
  #     **유일하게** 한 단지를 가리킬 때만 그 단지로 확정하고, 1차·2차가 같은 지번을
  #     쓰는 충돌 그룹(14건)에서는 게이트를 끄고 이름에 맡긴다
  #   - 이름 단독 매칭으로 생긴 오연결 1,659건을 정리했다(이동 329 + 끊기 1,330).
  #     카카오 63회 교차검증 — 시영장미 ← 7,544m 떨어진 양덕동 거래 67건 등
  #   - 근거: .planning/data-quality/matching-ambiguous-20260805.md (realtrade-story)
  #     *"이름이 같고 동이 다르면 지번을 먼저 본다"*
  #
  BASE_MULTI_JIBUN: 7

  # ── turnover_anomaly 23 → 33 (2026-08-21) ────────────────────────────────
  # 🔍 **조사한 뒤 올린다.** 원인 미상으로 올리지 않는다는 원칙은 그대로다.
  #
  # 확인한 것:
  #   1) 증가는 **결손 백필의 기계적 결과**다. 창원·김해 2015~2016 을 채우며 거래가
  #      +38,833건 늘었는데 분모(household_count)는 고정이라 더 많은 단지가 임계를
  #      넘는다. 이 지표는 이력이 길어질수록 자연히 커지는 구조다
  #   2) 상위권은 **회전율이 높은 게 아니라 `household_count` 가 과소 기재**돼 있다:
  #        신리마을중앙하이츠8단지   96세대 / 979건  → 연 88%
  #        석봉마을대동아파트        90세대 / 916건  → 연 88%
  #        현대2차아파트            120세대 / 1,044건 → 연 75%
  #      90세대에 916건은 회전율 문제가 아니다. 세대수가 틀린 것이다
  #      (석봉마을대동은 등록 동도 틀렸다 — 부곡동인데 거래는 무계동 915건)
  #
  # 즉 이 축이 지금 재는 것은 오염이 아니라 **`complexes` 메타데이터 품질**이다.
  #
  # ⚠️ **"household_count 백필로 고치면 된다"는 판단은 틀렸다** (2026-08-21 실측으로 정정).
  #    세대수 0/null 인 480곳 중 **K-apt 코드 보유는 20곳뿐**이다(세대수 있는 1,408곳은
  #    613곳이 보유). 나머지 460곳은 소형 빌라·연립이라 K-apt 에 등록 자체가 없다.
  #    건축물대장도 대안이 못 된다 — 실측하니 `hhldCnt`·`hoCnt`·`fmlyCnt` 가 **전부 0**으로
  #    온다(회원맨션 마산회원 회원동 29-4). 필드가 없는 게 아니라 국토부 원본에 값이 없다.
  #
  #    → **채울 데이터 소스가 존재하지 않는다.** 이 지표는 소형 건물에 대해 구조적으로
  #      의미가 없으며, 개선하려면 지표 정의를 바꿔야 한다(예: household_count > 0 인
  #      단지만 대상으로 삼기). 그건 이 워크플로가 참조하는 complex_integrity_counts
  #      함수를 고치는 일인데, 그 함수는 **저장소에 CREATE FUNCTION 이 없다**(프로덕션에만
  #      존재하는 마이그레이션 drift). 먼저 파일화가 필요하다.
  BASE_TURNOVER: 33
  BASE_EMPTY_KAPT: 59

jobs:
  check:
    name: 단지-거래 무결성
    runs-on: ubuntu-latest
    steps:
      - name: Install psql 17
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          echo | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Check integrity
        env:
          BACKUP_AGENT_PASSWORD: ${{ secrets.BACKUP_AGENT_PASSWORD }}
        run: |
          set -e
          export PGCONNECT_TIMEOUT=60
          export PGPASSWORD="$BACKUP_AGENT_PASSWORD"
          # ON_ERROR_STOP=1 이 없으면 RAISE EXCEPTION 이 나도 psql 이 0 을 반환해
          # 이 잡이 초록불이 된다 — 이번 점검이 잡아낸 부류의 실수가 정확히 그것이다.
          /usr/lib/postgresql/17/bin/psql \
            --host=aws-0-ap-northeast-2.pooler.supabase.com \
            --port=5432 \
            --username=backup_agent.jaamyvlsehlimtrxgrgn \
            --dbname=postgres \
            --no-password \
            -v ON_ERROR_STOP=1 \
            -v base_mj="$BASE_MULTI_JIBUN" \
            -v base_to="$BASE_TURNOVER" \
            -v base_ek="$BASE_EMPTY_KAPT" \
            <<'SQL'
          \set QUIET on
          \timing off
          -- psql 변수는 $$ ... $$ 안에서 치환되지 않는다. GUC 로 넘긴 뒤 DO 블록에서
          -- current_setting() 으로 읽는다. (여기 SET 줄은 달러인용 밖이라 치환된다.)
          SET myapp.base_mj = :base_mj;
          SET myapp.base_to = :base_to;
          SET myapp.base_ek = :base_ek;
          DO $$
          DECLARE
            r         record;
            base_mj   int := current_setting('myapp.base_mj')::int;
            base_to   int := current_setting('myapp.base_to')::int;
            base_ek   int := current_setting('myapp.base_ek')::int;
            worse     text[] := '{}';
            better    text[] := '{}';
            db_bytes  bigint;
            db_pct    numeric;
          BEGIN
            SELECT * INTO r FROM public.complex_integrity_counts(
              ARRAY['48121','48123','48125','48127','48129','48250']);

            RAISE INFO '다중 지번(동 다름, 소수 50건↑)  %  (기준 %)', r.multi_jibun, base_mj;
            RAISE INFO '회전율 이상(>25%%, 거래 100건↑)  %  (기준 %)', r.turnover_anomaly, base_to;
            RAISE INFO 'K-apt 등록인데 거래 0건          %  (기준 %)', r.empty_kapt, base_ek;

            -- DB 용량 상시 로깅 (실패 조건 아님, RAISE INFO 뿐).
            -- 2026-08-10 삭제(ADR-062)의 원인이 용량이었다 — 이 관측이 없으면 다음 지역
            -- 확장 판단이 다시 사람이 Dashboard 를 들여다보는 것에 의존하게 된다.
            SELECT pg_database_size(current_database()) INTO db_bytes;
            db_pct := round(db_bytes::numeric / (8192.0 * 1024 * 1024) * 100, 2);
            RAISE INFO 'DB 용량  %  / 8,192MB Pro 한도 (% 사용)', pg_size_pretty(db_bytes), (db_pct::text || '%');

            IF r.multi_jibun      > base_mj THEN worse := worse || format('multi_jibun %s→%s', base_mj, r.multi_jibun); END IF;
            IF r.turnover_anomaly > base_to THEN worse := worse || format('turnover %s→%s', base_to, r.turnover_anomaly); END IF;
            IF r.empty_kapt       > base_ek THEN worse := worse || format('empty_kapt %s→%s', base_ek, r.empty_kapt); END IF;

            IF r.multi_jibun      < base_mj THEN better := better || format('multi_jibun %s→%s', base_mj, r.multi_jibun); END IF;
            IF r.turnover_anomaly < base_to THEN better := better || format('turnover %s→%s', base_to, r.turnover_anomaly); END IF;
            IF r.empty_kapt       < base_ek THEN better := better || format('empty_kapt %s→%s', base_ek, r.empty_kapt); END IF;

            IF array_length(better,1) > 0 THEN
              RAISE INFO '기준선보다 낮아졌다: % — 워크플로의 BASE_* 를 내려 잠글 것',
                array_to_string(better, ', ');
            END IF;

            IF array_length(worse,1) > 0 THEN
              RAISE EXCEPTION E'오염이 늘었다: %\n조사 방법은 realtrade-story 의 .planning/data-quality/audit-20260806.md '
                '"검출 축 세 가지" 참고. 원인은 대개 셋 중 하나다 — 새 중복 레코드 생성 / '
                '병합이 시딩으로 되돌아감 / 매칭이 엉뚱한 단지를 잡음.',
                array_to_string(worse, ', ');
            END IF;

            RAISE INFO '기준선 이내';
          END $$;
          SQL
