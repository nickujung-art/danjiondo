name: Monthly AI Commentary Batch

on:
  schedule:
    # 매일 15:00 KST (UTC 06:00) — staleness 필터가 커서 역할.
    # 06:00 UTC 로 둔 이유: 20:00 선언은 지연 2~4h 를 먹으면 22:00~00:00 UTC 에 착지하는데
    # 그 창에 crawl-presale(00:04~00:33 착지)·weekly-regional(22:49~23:54)이 이미 있다.
    # Groq 워크플로 셋이 한 창에 몰리면 따라잡는 날 서로 TPD 를 뺏는다.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      area_bucket:
        description: 'Area bucket (소형/59/74/84/대형)'
        default: '84'
      limit:
        description: 'Max records (0=all)'
        default: '0'

jobs:
  generate-commentary:
    name: 단지별 AI 코멘트 생성
    runs-on: ubuntu-latest
    # 매일 돌면서 stale(25일) 항목만 처리. 대부분의 날은 stale 0건이라 즉시 종료된다.
    # 따라잡는 날(stale 가 쌓인 1~2일차)은 TPD 한도 408건까지 처리하며 23~37분 걸린다.
    # TPD 소진은 exit(0) + data_sources partial 로 보고한다.
    # timeout 은 그 23~37분에 여유를 더한 값이다. 15분이면 40~66% 에서 잘리고,
    # 타임아웃으로 죽으면 잡이 cancelled 라
    # markCronStatus() 가 아예 안 불린다 → data_sources 가 옛 상태로 남는다(2026-10-01 전례).
    # 어차피 시간이 아니라 TPD 가 먼저 멈춘다. 타임아웃은 무한 대기만 막으면 된다.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate AI Commentary
        # 파이프(| tee)가 스크립트 종료 코드를 삼키지 않도록 pipefail 을 켠다.
        # GitHub 기본 셸은 `bash -e {0}` 라 pipefail 이 없어, 스크립트가 exit 1 로 죽어도
        # tee 의 0 이 최종 종료 코드가 됐다(2026-08-03 발견 — 배치 전량 실패에도 초록불).
        shell: bash
        run: >-
          npx tsx scripts/generate-complex-commentary.ts
          --area-bucket=${{ github.event.inputs.area_bucket || '84' }}
          --limit=${{ github.event.inputs.limit || '0' }}
          2>&1 | tee commentary-run.log
        env:
          # 스크립트는 Groq(무료) 우선, Gemini fallback 이다. 그런데 여기서 GROQ_API_KEY 를
          # 안 넘겨서 **무료 경로를 두고 유료 경로로 갔고**, Gemini 월 지출 한도 초과(429)로
          # 2026-08-01 실행이 1,342건 전량 실패했다. ai_cached_at 이 06-11 에 멈춘 원인이다
          # (2026-08-04 전수조사에서 발견).
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-run-log-${{ github.run_id }}
          path: commentary-run.log
          retention-days: 14
