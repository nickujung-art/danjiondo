name: Monthly AI Commentary Batch

on:
  schedule:
    - cron: '0 20 1 * *'  # 매월 1일 05:00 KST (UTC 20:00)
  workflow_dispatch:
    inputs:
      area_bucket:
        description: 'Area bucket (소형/59/74/84/대형)'
        default: '84'
      limit:
        description: 'Max records (0=all)'
        default: '0'

jobs:
  generate-commentary:
    name: 단지별 AI 코멘트 생성
    runs-on: ubuntu-latest
    # Groq 무료 티어(30 RPM)에 맞춰 스크립트가 429 백오프로 자체 조절하므로, 1,300건 규모는
    # 30분 안에 못 끝난다. 예전엔 Gemini(유료)로 빠르게 돌아 30분이면 됐지만 한도 초과로
    # 전량 실패했다(2026-08-04). 무료 경로를 쓰기로 한 이상 시간을 늘리는 게 맞다.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate AI Commentary
        # 파이프(| tee)가 스크립트 종료 코드를 삼키지 않도록 pipefail 을 켠다.
        # GitHub 기본 셸은 `bash -e {0}` 라 pipefail 이 없어, 스크립트가 exit 1 로 죽어도
        # tee 의 0 이 최종 종료 코드가 됐다(2026-08-03 발견 — 배치 전량 실패에도 초록불).
        shell: bash
        run: >-
          npx tsx scripts/generate-complex-commentary.ts
          --area-bucket=${{ github.event.inputs.area_bucket || '84' }}
          --limit=${{ github.event.inputs.limit || '0' }}
          2>&1 | tee commentary-run.log
        env:
          # 스크립트는 Groq(무료) 우선, Gemini fallback 이다. 그런데 여기서 GROQ_API_KEY 를
          # 안 넘겨서 **무료 경로를 두고 유료 경로로 갔고**, Gemini 월 지출 한도 초과(429)로
          # 2026-08-01 실행이 1,342건 전량 실패했다. ai_cached_at 이 06-11 에 멈춘 원인이다
          # (2026-08-04 전수조사에서 발견).
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commentary-run-log-${{ github.run_id }}
          path: commentary-run.log
          retention-days: 14
