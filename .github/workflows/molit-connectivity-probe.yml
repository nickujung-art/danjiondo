name: MOLIT 연결 진단 (일회성)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS + TCP + HTTP 확인
        shell: bash
        run: |
          echo "── 러너 공인 IP ──"; curl -s -m 10 https://api.ipify.org || echo "(실패)"; echo
          echo "── DNS ──"; getent hosts apis.data.go.kr || echo "(DNS 실패)"
          echo "── HTTPS 헤더 ──"
          curl -s -m 20 -o /dev/null -w "HTTP %{http_code} · connect %{time_connect}s · total %{time_total}s\n" \
            "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?ServiceKey=dummy&LAWD_CD=48121&DEAL_YMD=202607&_type=json" \
            || echo "curl 실패 (exit $?)"
