name: MOLIT 연결 진단 (일회성)
on:
  workflow_dispatch: {}
jobs:
  probe:
    # 러너 IP 여러 개를 동시에 뽑아본다 — 한 job 은 IP 하나만 잡으므로
    # "일부 IP 대역만 차단" 가설은 단발 프로브로는 절대 확인할 수 없다.
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 러너 ${{ matrix.n }} — 실패 지점 그대로 재현
        shell: bash
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          IP=$(curl -s -m 10 https://api.ipify.org)
          echo "PROBE#${{ matrix.n }} IP=$IP"
          echo "PROBE#${{ matrix.n }} DNS=$(getent ahosts apis.data.go.kr | tr '\n' ' ')"
          # TCP 443 도달 자체를 먼저 본다 — 방화벽 DROP 이면 여기서 이미 막힌다
          timeout 12 bash -c 'cat < /dev/null > /dev/tcp/apis.data.go.kr/443' \
            && echo "PROBE#${{ matrix.n }} TCP443=OK" \
            || echo "PROBE#${{ matrix.n }} TCP443=FAIL"
          # 배치가 가장 먼저 때리는 조합(26110 / 202607)을 동일하게 호출하고 cause 까지 찍는다
          node -e '
            const n = process.argv[1];
            const u = new URL("https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev");
            u.searchParams.set("ServiceKey", process.env.MOLIT_API_KEY);
            u.searchParams.set("LAWD_CD", "26110");
            u.searchParams.set("DEAL_YMD", "202607");
            u.searchParams.set("pageNo", "1");
            u.searchParams.set("numOfRows", "100");
            u.searchParams.set("_type", "json");
            const t0 = Date.now();
            fetch(u.toString(), {
              headers: { Accept: "application/json", "User-Agent": "Mozilla/5.0" },
              signal: AbortSignal.timeout(15000),
            })
              .then(async r => console.log(`PROBE#${n} HTTP=${r.status} ms=${Date.now()-t0} body=${(await r.text()).replace(/\s+/g," ").slice(0,160)}`))
              .catch(e => console.log(`PROBE#${n} THROW=${e.name}:${e.message} ms=${Date.now()-t0} cause=${e.cause && (e.cause.code || e.cause.message)}`));
          ' "${{ matrix.n }}"
