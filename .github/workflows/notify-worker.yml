name: Notify Worker

on:
  schedule:
    # 매일 10:00 KST (UTC 01:00)
    #   - MOLIT 일배치(19:00 UTC = 04:00 KST) 6시간 뒤
    #   - Weekly Digest(월 00:00 UTC = 09:00 KST) 1시간 뒤
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    name: Poll & deliver notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call notify worker
        run: |
          STATUS=$(curl -sSf -o /tmp/notify_response.json -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/worker/notify")

          echo "HTTP status: $STATUS"
          cat /tmp/notify_response.json

          if [ "$STATUS" != "200" ]; then
            echo "Notify worker returned $STATUS"
            exit 1
          fi
