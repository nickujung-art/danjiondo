name: Naver Listings Biweekly

# [정기 실행 중단 — 2026-08-07, ADR-059]
# 네이버가 GitHub Actions IP 를 차단해 200개 단지가 전부 매물 0건으로 돌아온다.
# 국내 IP 에서 같은 코드를 돌리면 정상 수집되는 것을 두 번 확인했다(2026-08-03 로컬,
# 2026-08-07 프로브 — API 경로·응답 형태 그대로, 쿠키 유무·만료와 무관).
# 복구에는 자체 호스팅 러너나 프록시가 필요해 보류했다.
#
# 스케줄을 끄는 이유는 "안 되니까 숨긴다"가 아니라, **주 2회 확정 실패가 감시기를
# 무의미하게 만들기 때문**이다(ADR-057 의 school_alimi 전례). 신선도 감시 쪽에서는
# pausedReason 으로 계속 보이고, 차단이 풀리면 ▶️ 로 알려준다.
#
# 차단 해제 여부를 확인하려면 아래 workflow_dispatch 로 수동 실행한다(limit=10 권장).
# 수집이 되면 이 schedule 블록과 check-data-freshness 의 pausedReason 을 함께 되살린다.
on:
  # schedule:
  #   - cron: '0 1 * * 2'  # 화요일 10:00 KST (UTC 01:00)
  #   - cron: '0 1 * * 5'  # 금요일 10:00 KST (UTC 01:00)
  workflow_dispatch:
    inputs:
      limit:
        description: '처리 단지 수'
        default: '200'
      dry_run:
        description: 'Dry run (DB 미저장)'
        type: boolean
        default: false

jobs:
  collect:
    name: 호가 데이터 수집
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install chromium --with-deps

      - name: Collect naver listings
        # 파이프(| tee)가 스크립트 종료 코드를 삼키지 않도록 pipefail 을 켠다.
        # GitHub 기본 셸은 `bash -e {0}` 라 pipefail 이 없어, 스크립트가 exit 1 로 죽어도
        # tee 의 0 이 최종 종료 코드가 됐다(2026-08-03 발견 — 배치 전량 실패에도 초록불).
        shell: bash
        run: >-
          npx tsx scripts/crawl-naver-listings.ts
          --limit=${{ github.event.inputs.limit || '200' }}
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          2>&1 | tee listings-run.log
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_COOKIE:              ${{ secrets.NAVER_COOKIE }}

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listings-run-log-${{ github.run_id }}
          path: listings-run.log
          retention-days: 14
